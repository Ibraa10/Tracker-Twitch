name: Radar codes Gil2

on:
  # Toutes les 10 min entre 8h et 17h (heure de Bruxelles) : regarde si Gil2 ou Edouardo est en live.
  # Hors live → s'arrête en quelques secondes. En live → écoute le chat jusqu'à la fin du live.
  # GitHub compte en UTC : 6h-16h UTC couvre 8h-17h à Bruxelles hiver comme été,
  # le script filtre ensuite l'heure exacte de Bruxelles.
  schedule:
    - cron: "*/10 6-16 * * *"
  # Relance automatique quand radar.mjs ou ce fichier est mis à jour
  push:
    branches: [main]
    paths: ["radar.mjs", ".github/workflows/radar.yml"]
  # Bouton "Run workflow" : écoute forcée, même si le live n'est pas détecté
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée d'écoute en minutes (max 350)"
        default: "330"

# Un seul radar à la fois.
# Les vérifications automatiques attendent leur tour au lieu de couper un radar qui écoute un live ;
# une mise à jour du code ou un lancement manuel remplace le radar en cours.
concurrency:
  group: radar
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Écouter le chat
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHANNELS: "gil2_, edouardotv"
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          EVENT: ${{ github.event_name }}
          HOURS: "8-17"
          DURATION_MINUTES: ${{ github.event.inputs.minutes || '345' }}
        run: node radar.mjs
